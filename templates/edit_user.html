{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block page_title %}Edit User — {{ user.full_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card-panel">
            <div class="panel-header"><h3><i class="bi bi-pencil me-2"></i>Edit User</h3></div>
            <div class="panel-body" style="padding:24px;">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px;font-weight:500;">Full Name</label>
                        <input type="text" class="form-control" name="full_name" value="{{ user.full_name }}" required style="border-radius:8px;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px;font-weight:500;">Username</label>
                        <input type="text" class="form-control" value="{{ user.username }}" disabled style="border-radius:8px;background:#f5f5f5;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px;font-weight:500;">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ user.email }}" required style="border-radius:8px;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px;font-weight:500;">New Password (leave blank to keep current)</label>
                        <input type="password" class="form-control" name="password" style="border-radius:8px;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px;font-weight:500;">Role</label>
                        <select class="form-select" name="role" style="border-radius:8px;">
                            <option value="viewer" {{ 'selected' if user.role == 'viewer' }}>Viewer</option>
                            <option value="analyst" {{ 'selected' if user.role == 'analyst' }}>Analyst</option>
                            <option value="senior_analyst" {{ 'selected' if user.role == 'senior_analyst' }}>Senior Analyst</option>
                            {% if current_user.role == 'super_admin' %}
                            <option value="head_of_research" {{ 'selected' if user.role == 'head_of_research' }}>Head of Research</option>
                            <option value="super_admin" {{ 'selected' if user.role == 'super_admin' }}>Super Admin</option>
                            {% endif %}
                        </select>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" name="is_active" id="is_active" {{ 'checked' if user.is_active_user }}>
                        <label class="form-check-label" for="is_active" style="font-size:13px;">Active account</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" style="border-radius:8px;padding:8px 24px;font-size:13px;">Save Changes</button>
                        <a href="{{ url_for('users') }}" class="btn btn-outline-secondary" style="border-radius:8px;padding:8px 24px;font-size:13px;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
