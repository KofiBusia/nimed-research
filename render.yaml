databases:
  - name: nimed-db
    plan: free
    databaseName: nimed_db
    user: nimed_db_user

services:
  - type: web
    name: nimed-research
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nimed-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.1
